apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-web
  template:
    metadata:
      labels:
        app: node-web
    spec:
      containers:
      - name: node-container
        image: __IMAGE_PLACEHOLDER__ # Replaced dynamically by GitHub Actions
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: node-app-service
spec:
  type: LoadBalancer # Asks Azure to provide a public IP address
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: node-web
